name: Publish ExitWatch v0.7
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-v07.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack frozen submission
        shell: bash
        run: |
          set -euo pipefail
          base64 -d exitwatch_publish_payload.b64 > /tmp/exitwatch.zip
          echo "046235edfdf7c767abd8cf5e1a10897547a491bb94afad73b4e516e9772f9078  /tmp/exitwatch.zip" | sha256sum -c -
          rm -rf /tmp/exitwatch-unpack
          mkdir -p /tmp/exitwatch-unpack
          unzip -q /tmp/exitwatch.zip -d /tmp/exitwatch-unpack
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/exitwatch-unpack/exitwatch/. .
          rm -rf .pytest_cache
      - name: Commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish ExitWatch v0.7 submission build"
          git push
